<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="128" viewBox="0 0 1100 128" role="img" aria-label="Understand the problem. Connect the tools. Deliver the experience."><defs><linearGradient id="l"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><style>@keyframes glide{0%,100%{width:40px;opacity:.4}50%{width:240px;opacity:1}}.accent{animation:glide 6s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.accent{animation:none}}</style><g font-family="Arial,sans-serif"><g transform="translate(0,0)"><rect x="1" y="1" width="352" height="126" rx="12" fill="#101827" stroke="#29364c"/><rect class="accent" style="animation-delay:-0s" x="18" y="1" width="64" height="3" rx="1" fill="url(#l)"/><text x="22" y="36" fill="#64748b" font-family="monospace" font-size="12">01</text><text x="22" y="65" fill="#e2e8f0" font-size="18" font-weight="700" letter-spacing="1">UNDERSTAND</text><text x="22" y="99" fill="#94a3b8" font-size="13">Start with a problem worth solving.</text></g><g transform="translate(373,0)"><rect x="1" y="1" width="352" height="126" rx="12" fill="#101827" stroke="#29364c"/><rect class="accent" style="animation-delay:-2s" x="18" y="1" width="64" height="3" rx="1" fill="url(#l)"/><text x="22" y="36" fill="#64748b" font-family="monospace" font-size="12">02</text><text x="22" y="65" fill="#e2e8f0" font-size="18" font-weight="700" letter-spacing="1">CONNECT</text><text x="22" y="99" fill="#94a3b8" font-size="13">Bring agents, tools, and data together.</text></g><g transform="translate(746,0)"><rect x="1" y="1" width="352" height="126" rx="12" fill="#101827" stroke="#29364c"/><rect class="accent" style="animation-delay:-4s" x="18" y="1" width="64" height="3" rx="1" fill="url(#l)"/><text x="22" y="36" fill="#64748b" font-family="monospace" font-size="12">03</text><text x="22" y="65" fill="#e2e8f0" font-size="18" font-weight="700" letter-spacing="1">DELIVER</text><text x="22" y="99" fill="#94a3b8" font-size="13">Build experiences people can use.</text></g></g></svg>
